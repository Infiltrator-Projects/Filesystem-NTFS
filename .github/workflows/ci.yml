name: Build independent NTFS SO
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ntfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev cmake
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: |
          test -f build/NTFS.so
          nm -D build/NTFS.so | grep infiltrator_filesystem_ntfs_v1

      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          actual="$(cd "$stage" && find . -type f -printf '%P\\n' | LC_ALL=C sort)"
          expected="$(printf '%s\\n' 'System/Filesystems/NTFS.so' 'System/Resources/Documentation/Filesystem-NTFS/NTFS.pdf' | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Incorrect installed payload:\\n%s\\n' "$actual"
            exit 1
          fi
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-NTFS/NTFS.pdf")" = '%PDF-'
