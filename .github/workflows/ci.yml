name: Build independent NTFS SO
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ntfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev ntfs-3g-dev ntfs-3g cmake
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Test V2 host boundaries with AddressSanitizer
        run: |
          cmake -S . -B build-asan -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS='-fsanitize=address -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address \
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address
          cmake --build build-asan --parallel 2
          ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build-asan \
            -R '^ntfs-(native-v2-format|workspace-safety)$' --output-on-failure
      - run: |
          test -f build/NTFS.so
          nm -D --defined-only build/NTFS.so | grep -F infiltrator_filesystem_api_v2
          nm -D --defined-only build/NTFS.so | grep -F infiltrator_filesystem_ntfs_v1

      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/NTFS.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-NTFS.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-NTFS.pdf")" = '%PDF-'
