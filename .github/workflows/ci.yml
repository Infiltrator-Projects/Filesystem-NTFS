name: Build independent NTFS SO
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ntfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev cmake
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: |
          test -f build/NTFS.so
          nm -D --defined-only build/NTFS.so | grep -F infiltrator_filesystem_api_v2
          ! nm -D --defined-only build/NTFS.so | grep -E 'infiltrator_filesystem_.*_v1'

      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/NTFS.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-NTFS.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-NTFS.pdf")" = '%PDF-'
