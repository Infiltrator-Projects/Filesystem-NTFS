name: Qualify and release portable DEB and CPU-native source RUN
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ntfs-native-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and pinned Common dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev autoconf automake libtool libgcrypt20-dev
      - name: Qualify portable Debian and embed exact source into native RUN
        run: |
          set -euo pipefail
          python3 -m py_compile standalone/build.py standalone/release.py
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          sudo python3 standalone/check-documentation-upgrade.py dist/*.deb
          test "$(find dist -name '*.deb' | wc -l)" = 1
          test "$(find dist -name '*.run' | wc -l)" = 1
      - name: Prove source-embedded RUN creates CPU-native Debian with one SO and PDF
        run: |
          set -euo pipefail
          FS_SO="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["module"])')"
          FS_REPO="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["repository"])')"
          FS_ABI="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["abi"])')"
          FS_PDF="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["pdf"])')"
          run_file="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          bash "$run_file" --profile aggressive --build-only --output "$RUNNER_TEMP/native"
          deb_file="$(find "$RUNNER_TEMP/native" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -s "$deb_file"
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-Native-Profile)" = aggressive
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-PGO)" = trained-two-pass
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-LTO)" = enabled
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-Source-Revision)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/installed"
          dpkg-deb -x "$deb_file" "$RUNNER_TEMP/installed"
          test "$(find "$RUNNER_TEMP/installed" -type f | wc -l)" = 2
          test -s "$RUNNER_TEMP/installed/System/Filesystems/$FS_SO"
          test -s "$RUNNER_TEMP/installed/System/Resources/Documentation/$FS_REPO.pdf"
          readelf -Ws "$RUNNER_TEMP/installed/System/Filesystems/$FS_SO" | grep -F "$FS_ABI"
          ! readelf -d "$RUNNER_TEMP/installed/System/Filesystems/$FS_SO" | grep -Ei 'NEEDED.*(ntfs-3g|fuse)'
      - name: Exercise packaged NTFS modules with native-formatted media and 512/4096-byte host I/O
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends busybox-static cpio
          cmake -S . -B media-test -DCMAKE_BUILD_TYPE=Release
          cmake --build media-test --parallel 2 --target ntfs-disk-media ntfs-v2-namespace-test ntfs-v2-format-test ntfs-native-seed-media
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          for profile in portable installed; do
            reader="$RUNNER_TEMP/$profile/System/Filesystems/NTFS.so"
            bash tests/check_production_v2.sh "$reader"
            # The linked namespace harness must load this exact extracted carrier.
            LD_LIBRARY_PATH="$RUNNER_TEMP/$profile/System/Filesystems" \
              bash tests/disk-media.sh media-test/ntfs-disk-media media-test/ntfs-v2-namespace-test "$reader" media-test/ntfs-v2-format-test media-test/ntfs-native-seed-media
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-filesystem-release
          path: dist/*
          if-no-files-found: error
  # Full future BOOT/OVMF integration is not claimed by this package release.

  publish:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-filesystem-release
          path: dist
      - name: Publish real NTFS Common V2 hosted and freestanding reader
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" -eq 1
          ! find dist -name '*.ko' | grep .
          if gh release view "$tag" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            test "$target" = "$GITHUB_SHA" || {
              echo "Previous immutable tag $tag belongs to $target; bump VERSION" >&2
              exit 1
            }
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag exists without a qualified release; refusing" >&2
            exit 1
          else
            (cd dist && sha256sum -- *.deb *.run > SHA256SUMS.txt)
            gh release create "$tag" dist/*.deb dist/*.run dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "NTFS Common V2 native 512/1024/2048/4096-sector formatter $version" \
              --notes "Native Common V2 NTFS formatter and read-only hosted/freestanding readers. Packaged .deb and .run have passed separate genuine 512-, 1024-, 2048- and 4096-byte logical-sector volume format, probe and mount regressions. Both media geometries pass kernel/initramfs reads using 512-byte and 4096-byte host I/O, MFT/checksum and dirty-volume negative tests, with unchanged source media. No external NTFS filesystem utility or NTFS-3G/FUSE runtime was required; the original licensed NTFS helper source is embedded and compiled into the shared object. No V1 public export or .ko asset; firmware profile is import-free. Hosted CORE and DEFRAG.MAP now use the same native NTFS reader as the embedded freestanding ELF; actual future BOOT V2/OVMF handoff is not yet qualified."
          fi
          mkdir -p "$RUNNER_TEMP/released"
          gh release download "$tag" -p '*.deb' -p '*.run' --dir "$RUNNER_TEMP/released"
          (cd "$RUNNER_TEMP/released" && sha256sum -- *.deb *.run)
